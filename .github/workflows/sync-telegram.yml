name: Sync Telegram posts

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync posts from Telegram
        run: |
          cat > sync_telegram.py << 'PYEOF'
          import html
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime

          CHANNEL = "kazakovvprave"
          BASE = f"https://t.me/s/{CHANNEL}"
          HEADERS = {"User-Agent": "Mozilla/5.0 (compatible; SiteSyncBot/1.0; +https://advocatekazakov.ru/)"}
          MAX_PAGES = 60
          HOME_COUNT = 4

          MSG_ANCHOR_RE = re.compile(r'<div class="tgme_widget_message[^"]*"\s+data-post="([a-zA-Z0-9_]+/(\d+))"')
          TEXT_RE = re.compile(r'<div class="tgme_widget_message_text js-message_text[^"]*"[^>]*>(.*?)</div>', re.S)
          TIME_RE = re.compile(r'<time[^>]+datetime="([^"]+)"')
          TAG_RE = re.compile(r'<[^>]+>')
          BR_RE = re.compile(r'<br\s*/?>', re.I)
          WS_RE = re.compile(r'[ \t]+')
          NL_RE = re.compile(r'\n{3,}')

          SERVICE_PATTERNS = [
              re.compile(r'^Channel created$'),
              re.compile(r'^Channel photo (updated|removed)'),
              re.compile(r'^Channel name changed'),
              re.compile(r'^Group created$'),
              re.compile(r'\bpinned\s'),
          ]


          def is_service_text(text):
              return any(p.search(text) for p in SERVICE_PATTERNS)


          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      return resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return ""
                  raise


          def clean_text(raw_html):
              t = BR_RE.sub("\n", raw_html)
              t = TAG_RE.sub("", t)
              t = html.unescape(t)
              t = WS_RE.sub(" ", t)
              t = NL_RE.sub("\n\n", t)
              return t.strip()


          def parse_page(page_html):
              anchors = list(MSG_ANCHOR_RE.finditer(page_html))
              posts = []
              for i, m in enumerate(anchors):
                  post_id_full = m.group(1)
                  msg_id = int(m.group(2))
                  start = m.start()
                  end = anchors[i + 1].start() if i + 1 < len(anchors) else len(page_html)
                  block = page_html[start:end]

                  text_m = TEXT_RE.search(block)
                  if not text_m:
                      continue
                  text = clean_text(text_m.group(1))
                  if not text or is_service_text(text):
                      continue

                  time_m = TIME_RE.search(block)
                  dt = None
                  if time_m:
                      try:
                          dt = datetime.fromisoformat(time_m.group(1))
                      except ValueError:
                          dt = None

                  posts.append({
                      "id": msg_id,
                      "text": text,
                      "date": dt,
                      "url": f"https://t.me/{post_id_full}",
                  })
              return posts


          def fetch_all_posts():
              all_posts = {}
              before = None
              for _ in range(MAX_PAGES):
                  url = BASE if before is None else f"{BASE}?before={before}"
                  page_html = fetch(url)
                  if not page_html:
                      break
                  page_posts = parse_page(page_html)
                  if not page_posts:
                      break

                  new_ids = [p["id"] for p in page_posts if p["id"] not in all_posts]
                  for p in page_posts:
                      all_posts[p["id"]] = p

                  min_id = min(p["id"] for p in page_posts)
                  if before is not None and min_id >= before:
                      break
                  if not new_ids:
                      break
                  before = min_id

              return sorted(all_posts.values(), key=lambda p: p["id"], reverse=True)


          def excerpt(text, limit=220):
              if len(text) <= limit:
                  return text
              cut = text[:limit].rsplit(" ", 1)[0]
              return cut + "…"


          def format_date(dt):
              if not dt:
                  return ""
              months = ["января", "февраля", "марта", "апреля", "мая", "июня",
                        "июля", "августа", "сентября", "октября", "ноября", "декабря"]
              return f"{dt.day} {months[dt.month - 1]} {dt.year}"


          def render_card(post):
              return (
                  '<a href="{url}" target="_blank" rel="noopener" '
                  'style="background:var(--surface); border:1px solid var(--line); padding:22px; '
                  'display:flex; flex-direction:column; gap:10px; text-decoration:none;">'
                  '<span style="font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);">{date}</span>'
                  '<p style="font-size:15px; color:var(--ink); margin:0; line-height:1.5;">{text}</p>'
                  '<span style="margin-top:auto; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent);">Читать в Telegram →</span>'
                  '</a>'
              ).format(url=post["url"], date=format_date(post["date"]), text=html.escape(excerpt(post["text"])))


          def replace_between(content, start_marker, end_marker, inner):
              pattern = re.compile(re.escape(start_marker) + r'.*?' + re.escape(end_marker), re.S)
              if not pattern.search(content):
                  raise RuntimeError(f"Markers not found: {start_marker} ... {end_marker}")
              return pattern.sub(lambda _m: start_marker + "\n" + inner + "\n" + end_marker, content)


          def main():
              posts = fetch_all_posts()
              if not posts:
                  print("No posts parsed, leaving files untouched.")
                  return

              home_html = "\n".join(render_card(p) for p in posts[:HOME_COUNT])
              archive_html = "\n".join(render_card(p) for p in posts)

              with open("index.html", "r", encoding="utf-8") as f:
                  index_content = f.read()
              index_content = replace_between(index_content, "<!-- TG_POSTS_HOME_START -->", "<!-- TG_POSTS_HOME_END -->", home_html)
              with open("index.html", "w", encoding="utf-8") as f:
                  f.write(index_content)

              with open("archive.html", "r", encoding="utf-8") as f:
                  archive_content = f.read()
              archive_content = replace_between(archive_content, "<!-- TG_POSTS_ARCHIVE_START -->", "<!-- TG_POSTS_ARCHIVE_END -->", archive_html)
              with open("archive.html", "w", encoding="utf-8") as f:
                  f.write(archive_content)

              print(f"Synced {len(posts)} posts ({min(len(posts), HOME_COUNT)} on homepage).")


          if __name__ == "__main__":
              main()
          PYEOF
          python3 sync_telegram.py

      - name: Commit and push if changed
        run: |
          rm -f sync_telegram.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add index.html archive.html
            git commit -m "chore: sync latest Telegram posts"
            git push
          fi
